name: CI

on:
  pull_request:
    branches: [main, consolidation/job-os]
  push:
    branches: [main, consolidation/job-os]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Secret hygiene
        shell: bash
        run: |
          if git ls-files --error-unmatch env >/dev/null 2>&1; then
            echo "Refusing to build with a tracked bare env file."
            exit 1
          fi

          if git grep -q -E 'VITE_[A-Z0-9_]*(PASSWORD|SECRET|TOKEN)=' -- . ':!*.md'; then
            echo "Refusing to expose password/secret/token values through VITE_* variables."
            exit 1
          fi

          if git grep -q -E 'postgres(ql)?://[^[:space:]/]+:[^[:space:]@]+@' -- . ':!.env.example' ':!.github/workflows/ci.yml'; then
            echo "Possible credential-bearing PostgreSQL URL found in tracked files."
            exit 1
          fi

          # Gmail app passwords are 16 letters. Block values with that shape even
          # when they are accidentally pasted into Markdown deployment guides.
          if git grep -q -E '(GMAIL_APP_PASSWORD|EMAIL_PASS)=[a-z]{16}([[:space:]]|$)' -- .; then
            echo "Possible literal Gmail app password found in tracked files."
            exit 1
          fi

          # Runtime/admin credentials belong in Render/GitHub secrets, not tracked
          # source files. Documentation may only use clearly recognizable placeholders.
          admin_source_hits="$(git grep -n -E '^[[:space:]]*ADMIN_PASSWORD=[^[:space:]]+' -- . ':!*.md' ':!.env.example' ':!.github/workflows/ci.yml' || true)"
          if [ -n "$admin_source_hits" ]; then
            echo "Literal ADMIN_PASSWORD assignment found outside approved examples/docs."
            echo "$admin_source_hits"
            exit 1
          fi

          while IFS= read -r assignment; do
            [ -z "$assignment" ] && continue
            value="${assignment#*=}"
            case "$value" in
              YOUR_*|your_*|REPLACE_*|'<>'|'<'*'>'|'${'*'}') ;;
              *)
                echo "ADMIN_PASSWORD documentation value must be an obvious placeholder."
                exit 1
                ;;
            esac
          done < <(git grep -h -E '^[[:space:]]*ADMIN_PASSWORD=[^[:space:]]+' -- '*.md' || true)

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Pricing regression tests
        run: npm run test:pricing

      - name: Job OS tests (domain, lifecycle on memory + Postgres, API security, staging outbound)
        run: npm run test:jobos

      - name: Build
        run: npm run build
