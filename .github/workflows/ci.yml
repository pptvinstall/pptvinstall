name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Secret hygiene
        shell: bash
        run: |
          if git ls-files --error-unmatch env >/dev/null 2>&1; then
            echo "Refusing to build with a tracked bare env file."
            exit 1
          fi

          if git grep -q -E 'VITE_[A-Z0-9_]*(PASSWORD|SECRET|TOKEN)=' -- . ':!*.md'; then
            echo "Refusing to expose password/secret/token values through VITE_* variables."
            exit 1
          fi

          if git grep -q -E 'postgres(ql)?://[^[:space:]/]+:[^[:space:]@]+@' -- . ':!.env.example' ':!.github/workflows/ci.yml'; then
            echo "Possible credential-bearing PostgreSQL URL found in tracked files."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build
